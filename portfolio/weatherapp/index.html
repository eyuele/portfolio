<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="quote.js" defer></script>
    <script src="todolist.js" defer></script>
</head>

<body>
    <nav class="navigation">
        <div class="container">
            <div class="themecontainer">
                <button></button>
                <button></button>
                <button></button>
                <button></button>
                <button></button>
            </div>
            <div class="darkmode"> <button></button></div>
        </div>
    </nav>

    <main class="main">
        <section class="clockweather default">
            <ul>
                <li id="clock" class="clock">--:--:--</li>
                <li id="country" class="weather">location</li>
            </ul>
            <div>
                <div id="icon"></div>
                <p id="weather" class="weather">weather</p>
            </div>
        </section>

        <div class="container">
            <section class="weatherndquote default">
                <div class="weather">
                    <label for="countryField">Enter a city:</label>
                    <input id="countryField" type="text" placeholder="Enter a city">
                    <ul id="valueValidator"></ul>
                    <div>
                        <button id="getweather">GET WEATHER</button>
                        <button id="reset">reset</button>
                    </div>
                    <a href="https://time.now">World Time API by Time.Now</a>
                </div>
            </section>

            <section class="quote default">
                <div class="quote-container">
                    <p id="quoteText">Quote goes here</p>
                    <p id="authorName">- Author</p>
                </div>
                <button id="generateBtn">Generate Quote</button>
            </section>

            <section class="todolist-section">
                <button id="todolistBtnShow"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
                    </svg>
                </button>
                <div id="todolist" class="todolist default">

                    <div class="todolist-header">
                        <input id="taskInput" type="text" placeholder="Add a task">
                        <button id="addBtn">ADD</button>
                    </div>
                    <div class="todolist-container show">
                        <ul id="taskList"></ul>
                    </div>
                    <button id="todolistBtnHide">back</button>
                </div>
            </section>

        </div>
    </main>
</body>

</html>
