<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen Real Estate</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navigation">
        <!-- svg design of logo integrating the G and an arrow -->
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- The logo will be here -->
            </svg>
        </div>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#properties">Properties</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <a href="#contact">Contact</a>
    </nav>
    <main class="main">
        <section class="hero">
            <div class="container">
                <h1>NextGen Real Estate </h1>
                <a href="">apply now</a>
                <a href="">explore</a>
            </div>
        </section>
        <section class="apply">
            <div class="container">
                <div class="img"></div>
                <div class="content">

                    <button>Apply</button>
                </div>
            </div>
        </section>
        <section class="carousel">
            <div class="container">
                <div class="cards"></div>
            </div>
        </section>
        <section class="gallery">
            <div class="container">

            </div>
        </section>
        <section id="contact" class="contact">
            <form>
                <label for="Name">Name</label>
                <input type="text" name="Name" placeholder="Name" id="nameInp">
                <label for="Email">Email</label>
                <input type="email" name="Email" placeholder="Email" id="emailInp">
                <label for="Message">Message</label>
                <textarea name="Message" id="messageInp"></textarea>
                <input type="button" value="send">
            </form>

        </section>
        <section class="footer">
            <div class="container">
                <!-- Footer content -->
            </div>
            <div class="copyright">
                <p>&copy; 2024 NextGen Real Estate. All rights reserved.</p>
            </div>
        </section>
    </main>

</body>

</html>
